<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Уроки Стаса</title>
<meta name="robots" content="noindex, nofollow">
<meta name="lesson-catalog" content="1">
<meta name="theme-color" content="#eceef4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07090f" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;700;800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: floating liquid-glass bar over a living light field tinted by the lesson covers; YouTube-like 16:9 shelf below. */
:root{
  --bg:#eceef4; --fg:#10131b; --fg-2:#4b5265; --fg-3:#6c7386;
  --line:rgba(16,19,27,.09); --line-2:rgba(16,19,27,.15);
  --glass:rgba(255,255,255,.5); --glass-2:rgba(250,251,253,.8);
  --rim:rgba(255,255,255,.95); --rim-2:rgba(255,255,255,.2);
  --field:rgba(255,255,255,.62); --hover:rgba(16,19,27,.06);
  --chip:rgba(255,255,255,.58); --chip-on:#10131b; --chip-on-fg:#fff;
  --seg-ind:rgba(255,255,255,.92);
  --shadow-sm:0 1px 2px rgba(20,28,56,.06),0 6px 18px rgba(20,28,56,.07);
  --shadow:0 2px 6px rgba(20,28,56,.06),0 22px 60px rgba(20,28,56,.16);
  --scrim:rgba(214,219,232,.4);
  --accent:#0a66f5; --accent-fg:#fff;
  --gold:#e3a100; --new:#0f9d4f; --game:#e06400; --done:#0b968a; --warn:#c96a00;
  --ph:rgba(16,19,27,.07); --spec-1:rgba(255,255,255,.95); --spec-2:rgba(170,185,255,.28); --spec-blend:normal; --spec-rim:rgba(120,140,255,.9); --h1c:#4a5fc4;
  --aurora-op:.8; --grain-op:.28;
  --f-display:"Geologica","Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --spring-soft:cubic-bezier(.2,1.15,.35,1);
  --out:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#07090f; --fg:#f1f3f8; --fg-2:#a7aec0; --fg-3:#8b93aa;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --glass:rgba(255,255,255,.065); --glass-2:rgba(17,20,30,.78);
  --rim:rgba(255,255,255,.42); --rim-2:rgba(255,255,255,.04);
  --field:rgba(255,255,255,.065); --hover:rgba(255,255,255,.08);
  --chip:rgba(255,255,255,.065); --chip-on:#f1f3f8; --chip-on-fg:#0b0d14;
  --seg-ind:rgba(255,255,255,.16);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.25);
  --shadow:0 2px 8px rgba(0,0,0,.35),0 26px 70px rgba(0,0,0,.55);
  --scrim:rgba(3,5,9,.5);
  --accent:#4f9dff; --accent-fg:#04101f;
  --gold:#ffcc33; --new:#3ddc84; --game:#ffa24a; --done:#45d8c8; --warn:#ffb24d;
  --ph:rgba(255,255,255,.06); --spec-1:rgba(255,255,255,.24); --spec-2:rgba(255,255,255,.07); --spec-blend:normal; --spec-rim:rgba(255,255,255,1); --h1c:#93a5ff;
  --aurora-op:.58; --grain-op:.45;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#07090f; --fg:#f1f3f8; --fg-2:#a7aec0; --fg-3:#8b93aa;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --glass:rgba(255,255,255,.065); --glass-2:rgba(17,20,30,.78);
  --rim:rgba(255,255,255,.42); --rim-2:rgba(255,255,255,.04);
  --field:rgba(255,255,255,.065); --hover:rgba(255,255,255,.08);
  --chip:rgba(255,255,255,.065); --chip-on:#f1f3f8; --chip-on-fg:#0b0d14;
  --seg-ind:rgba(255,255,255,.16);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.25);
  --shadow:0 2px 8px rgba(0,0,0,.35),0 26px 70px rgba(0,0,0,.55);
  --scrim:rgba(3,5,9,.5);
  --accent:#4f9dff; --accent-fg:#04101f;
  --gold:#ffcc33; --new:#3ddc84; --game:#ffa24a; --done:#45d8c8; --warn:#ffb24d;
  --ph:rgba(255,255,255,.06); --spec-1:rgba(255,255,255,.24); --spec-2:rgba(255,255,255,.07); --spec-blend:normal; --spec-rim:rgba(255,255,255,1); --h1c:#93a5ff;
  --aurora-op:.58; --grain-op:.45;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:100px}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}

.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:16px;height:16px}
.ic.xs{width:13px;height:13px;stroke-width:2.2}

/* Living background */
#aurora{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:var(--aurora-op);transition:opacity .8s}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:var(--grain-op);mix-blend-mode:overlay;background-size:180px 180px}

/* Liquid glass */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);box-shadow:var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(165deg,var(--rim),var(--rim-2) 34%,var(--rim-2) 66%,var(--rim));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.spec::after{content:"";position:absolute;z-index:-1;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .45s;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%),var(--spec-1),var(--spec-2) 38%,transparent 66%);mix-blend-mode:var(--spec-blend)}
.spec::before{background:radial-gradient(150px circle at var(--mx,-999px) var(--my,-999px),var(--spec-rim),transparent 70%),linear-gradient(165deg,var(--rim),var(--rim-2) 34%,var(--rim-2) 66%,var(--rim))!important}
.spec:hover::after{opacity:1}
html.refract .lg{-webkit-backdrop-filter:blur(10px) saturate(190%) brightness(1.04);backdrop-filter:url(#lg-distort) blur(10px) saturate(190%) brightness(1.04)}

.app{position:relative;z-index:2;max-width:1640px;margin:0 auto;padding-block:12px 96px;
  padding-left:max(clamp(16px,3vw,40px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,3vw,40px),env(safe-area-inset-right,0px))}

/* Top bar */
.topbar{view-transition-name:topbar;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:30;display:flex;align-items:center;gap:12px;height:66px;padding:0 10px 0 12px;border-radius:24px;transition:box-shadow .4s,background .4s}
.topbar.scrolled{background:var(--glass-2)}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;flex:none;border-radius:14px;padding:4px}
.mark{position:relative;width:38px;height:38px;flex:none}
.mark i{position:absolute;inset:0;border-radius:11px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.mark i:nth-child(1){background:linear-gradient(135deg,#ff8a5b,#ff4f6d);transform:rotate(-12deg) translate(-3px,1px) scale(.86)}
.mark i:nth-child(2){background:linear-gradient(135deg,#ffd166,#ff9f1c);transform:rotate(7deg) translate(3px,-1px) scale(.9)}
.mark i:nth-child(3){background:linear-gradient(135deg,#4cc9f0,#3a6cf4);display:grid;place-items:center;color:#fff}
.mark i:nth-child(3) svg{width:18px;height:18px;stroke-width:2.2}
.brand:hover .mark i:nth-child(1){transform:rotate(-20deg) translate(-6px,2px) scale(.86)}
.brand:hover .mark i:nth-child(2){transform:rotate(14deg) translate(6px,-2px) scale(.9)}
.mark i{transition:transform .5s var(--spring)}
.brand-t{display:flex;flex-direction:column;line-height:1.05}
.brand-t b{font:700 17px/1.1 var(--f-display);letter-spacing:-.02em}
.brand-t span{font:500 11px/1.2 var(--f-mono);color:var(--fg-3);letter-spacing:.02em}

.search{position:relative;flex:1;max-width:620px;margin-inline:auto;min-width:0}
.search .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--fg-3);pointer-events:none}
.search input{width:100%;height:46px;border-radius:999px;border:1px solid var(--line);background:var(--field);padding:0 74px 0 44px;outline:none;transition:border-color .25s,box-shadow .25s,background .25s;font-size:15px}
.search input::placeholder{color:var(--fg-3)}
.search input:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.search input::-webkit-search-cancel-button{display:none}
.kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;gap:4px;align-items:center}
.kbd kbd{font:600 11px/1 var(--f-mono);padding:4px 7px;border-radius:7px;border:1px solid var(--line-2);color:var(--fg-3);background:var(--field)}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:var(--hover);color:var(--fg-2);display:grid;place-items:center}
.tb-actions{display:flex;align-items:center;gap:2px;flex:none}
.ibtn{position:relative;width:42px;height:42px;border-radius:14px;border:0;background:transparent;color:var(--fg-2);display:grid;place-items:center;transition:background .2s,color .2s,transform .35s var(--spring)}
.ibtn:hover{background:var(--hover);color:var(--fg)}
.ibtn:active{transform:scale(.9)}
.ibtn.spin .ic{animation:spin 1s linear infinite}
.ibtn .pip{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}

/* Hero */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px 32px;flex-wrap:wrap;padding:44px 4px 20px}
.eyebrow{font:600 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);display:flex;gap:10px;align-items:center}
.eyebrow .live{width:7px;height:7px;border-radius:50%;background:var(--new);box-shadow:0 0 0 0 color-mix(in srgb,var(--new) 60%,transparent);animation:pulse 2.4s infinite}
.eyebrow .live.off{background:var(--warn);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--new) 55%,transparent)}70%,100%{box-shadow:0 0 0 9px transparent}}
.hero h1{margin:12px 0 0;font:800 clamp(40px,6.4vw,76px)/.92 var(--f-display);letter-spacing:-.045em;text-wrap:balance}
.hero h1 em{position:relative;display:inline-block;font-style:normal;margin-left:.08em;padding:.02em .26em .12em;border-radius:.36em;vertical-align:top;
  background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);box-shadow:var(--shadow),inset 0 1px 0 var(--rim);
  animation:pop .9s .15s var(--spring) both}
.hero h1 em::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(165deg,var(--rim),var(--rim-2) 34%,var(--rim-2) 66%,var(--rim));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.hero h1 em span{position:relative;background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.9) 48%,rgba(255,255,255,.2) 54%,transparent 62%) 0 0/260% 100% no-repeat,linear-gradient(var(--fg),var(--fg));
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 6s var(--out) infinite}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.9)}}
@keyframes sheen{0%,55%{background-position:160% 0,0 0}100%{background-position:-120% 0,0 0}}
.stats{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:20px}
.stat{display:flex;align-items:baseline;gap:7px;color:var(--fg-2);font-size:14px}
.stat b{font:700 26px/1 var(--f-display);color:var(--fg);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero-side{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sortdd{position:relative}
.select{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 14px 0 16px;border:0;font-weight:600;font-size:14px;color:var(--fg);transition:transform .35s var(--spring)}
.select:active{transform:scale(.97)}
.select .ic{color:var(--fg-2)}
.select .chev{width:16px;height:16px;transition:transform .45s var(--spring)}
.select[aria-expanded="true"] .chev{transform:rotate(180deg)}
.menu{position:absolute;z-index:40;top:calc(100% + 10px);right:0;min-width:260px;padding:6px;border-radius:22px;display:flex;flex-direction:column;gap:2px;
  opacity:0;transform:translateY(-8px) scale(.94);transform-origin:top right;pointer-events:none;visibility:hidden;
  transition:opacity .3s var(--out),transform .5s var(--spring),visibility 0s .5s}
.menu.open{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition:opacity .3s var(--out),transform .5s var(--spring),visibility 0s}
.menu button{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border:0;border-radius:15px;background:transparent;font-size:14.5px;font-weight:500;color:var(--fg);text-align:left;transition:background .2s}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:none}
.menu button .ic{color:var(--accent);opacity:0;transition:opacity .2s,transform .4s var(--spring);transform:scale(.5)}
.menu button[aria-selected="true"]{font-weight:650;font-weight:600}
.menu button[aria-selected="true"] .ic{opacity:1;transform:none}
.menu .sep{height:1px;margin:4px 10px;background:var(--line)}
.pill{border-radius:999px}
.vt{display:inline-flex;padding:4px;gap:2px;border-radius:999px}
.vt button{width:40px;height:36px;border-radius:999px;border:0;background:transparent;color:var(--fg-3);display:grid;place-items:center;transition:background .3s,color .3s}
.vt button[aria-pressed="true"]{background:var(--seg-ind);color:var(--fg);box-shadow:var(--shadow-sm)}

/* Tabs with sliding liquid indicator */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.seg-wrap{max-width:100%;overflow-x:auto;scrollbar-width:none;border-radius:999px;padding:2px}
.seg-wrap::-webkit-scrollbar{display:none}
.seg{position:relative;display:inline-flex;padding:5px;gap:2px;border-radius:999px}
.seg button{position:relative;z-index:2;display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 17px;border-radius:999px;font-weight:600;font-size:14.5px;color:var(--fg-2);white-space:nowrap;transition:color .3s}
.seg button[aria-selected="true"]{color:var(--fg)}
.seg button:hover{color:var(--fg)}
.seg .cnt{font:600 11px/1 var(--f-mono);padding:4px 7px;border-radius:999px;background:var(--hover);font-variant-numeric:tabular-nums}
.seg .cnt.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.seg .ind{position:absolute;z-index:1;top:5px;bottom:5px;left:0;width:60px;border-radius:999px;background:var(--seg-ind);box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .6s var(--spring-soft),width .6s var(--spring-soft)}
.seg .ind.squish{animation:squish .6s var(--out)}
@keyframes squish{0%{scale:1 1}35%{scale:1.08 .86}70%{scale:.98 1.03}100%{scale:1 1}}

/* Filters */
.filters{display:grid;gap:8px;margin:4px 0 26px}
.frow{display:flex;align-items:center;gap:12px;min-width:0}
.flabel{flex:none;width:74px;font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-2)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 2px;min-width:0;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);padding-right:40px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--chip);-webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);box-shadow:inset 0 1px 0 var(--rim-2),0 2px 8px rgba(20,28,56,.06);font-size:14px;font-weight:500;transition:background .25s,color .25s,border-color .25s,transform .35s var(--spring);white-space:nowrap}
.chip:hover{border-color:var(--line-2);transform:translateY(-1px)}
.chip:active{transform:scale(.95)}
.chip.av-chip{padding-left:5px}
.chip .n{font:600 11px/1 var(--f-mono);color:var(--fg-3);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg);border-color:transparent}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.65}
.chip.hint{color:var(--fg-2);border-style:dashed;border-color:var(--line-2)}
.av{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--f-display);color:#fff;background:linear-gradient(140deg,hsl(var(--h,210) 80% 62%),hsl(calc(var(--h,210) + 35) 75% 46%));box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.av.none{background:var(--hover);color:var(--fg-3)}
.av.none .ic{width:14px;height:14px}

/* Notices */
.notice{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;margin:0 0 22px;font-size:14px;color:var(--fg-2)}
.notice b{color:var(--fg)}
.notice .grow{flex:1;min-width:0}
.notice .ic{color:var(--warn)}

/* Sections */
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 14px}
.sect-h h2{margin:0;font:700 19px/1.2 var(--f-display);letter-spacing:-.02em}
.sect-h span{font:500 12px/1 var(--f-mono);color:var(--fg-3)}
.recent{margin-bottom:34px}
.rrow{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;padding:6px 2px 10px;scroll-snap-type:x proximity}
.rrow::-webkit-scrollbar{display:none}
.rcard{flex:none;width:232px;scroll-snap-align:start;text-decoration:none;display:flex;flex-direction:column;gap:9px;border-radius:16px}
.rcard .frame{border-radius:14px}
.rcard b{font:600 13.5px/1.3 var(--f-body);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.rcard small{display:block;font:500 11.5px/1 var(--f-mono);color:var(--fg-3);margin-top:3px}
.rcard:hover .frame img{transform:scale(1.05)}

/* Grid of lessons */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(296px,1fr));gap:34px 22px}
.card{position:relative;min-width:0;display:flex;flex-direction:column;gap:13px}
.card.enter{animation:rise .75s var(--out) both;animation-delay:calc(min(var(--i,0),18) * 40ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.cover{position:relative;isolation:isolate}
.cover::before{content:"";position:absolute;inset:10% 6% -4%;border-radius:30px;background:var(--tint,transparent);filter:blur(30px);opacity:0;transform:scale(.9);transition:opacity .6s var(--out),transform .6s var(--out);z-index:-1}
.card:hover .cover::before,.card:focus-within .cover::before{opacity:.85;transform:scale(1.04)}
.frame{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:18px;overflow:hidden;background:var(--ph);container-type:inline-size;transform:translateZ(0);box-shadow:0 1px 0 var(--line),var(--shadow-sm);transition:transform .55s var(--spring-soft),box-shadow .55s var(--out)}
.card:hover .frame{transform:translateY(-4px) scale(1.012);box-shadow:0 1px 0 var(--line),var(--shadow)}
.frame img.cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);filter:blur(10px);transition:opacity .7s var(--out),transform 1.1s var(--out),filter .7s var(--out)}
.frame img.cv.on{opacity:1;transform:scale(1);filter:none}
.card:hover .frame img.cv.on{transform:scale(1.045)}
.frame .shim{position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.14) 50%,transparent 70%) 0 0/250% 100%;animation:shim 1.6s linear infinite}
.frame.ready .shim{opacity:0;transition:opacity .4s;animation:none}
@keyframes shim{from{background-position:120% 0}to{background-position:-130% 0}}
.frame .gloss{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 26%),linear-gradient(0deg,rgba(0,0,0,.28),transparent 34%);mix-blend-mode:normal;opacity:.9}
.hit{position:absolute;inset:0;z-index:3;border-radius:inherit}
.hit:focus-visible{outline-offset:-3px}

/* Generated cover */
.gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:2.5cqw;padding:7cqw 7cqw 8cqw;color:#fff;overflow:hidden;
  background:radial-gradient(90% 120% at 100% 0%,hsl(var(--h2) 90% 64% / .95),transparent 62%),radial-gradient(70% 90% at 0% 100%,hsl(calc(var(--h1) - 30) 90% 50% / .7),transparent 65%),linear-gradient(150deg,hsl(var(--h1) 72% 36%),hsl(calc(var(--h1) + 40) 70% 16%))}
.gen::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:9cqw 9cqw;-webkit-mask-image:linear-gradient(200deg,#000,transparent 70%);mask-image:linear-gradient(200deg,#000,transparent 70%)}
.gen .g-big{position:absolute;right:-3cqw;top:-12cqw;font:800 58cqw/1 var(--f-display);letter-spacing:-.06em;color:rgba(255,255,255,.1)}
.gen .g-k{position:relative;font:600 3.6cqw/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.gen .g-t{position:relative;font:800 9.4cqw/.98 var(--f-display);letter-spacing:-.035em;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 20px rgba(0,0,0,.25)}

/* Badges on cover */
.b-tl,.b-bl{position:absolute;z-index:4;left:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.b-tl{top:10px}
.b-bl{bottom:10px}
.b-br{position:absolute;z-index:4;right:10px;bottom:10px;pointer-events:none}
.b-tr{position:absolute;z-index:4;right:10px;top:10px;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font:600 11.5px/1 var(--f-body);color:#fff;background:rgba(12,14,22,.55);-webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);letter-spacing:.01em}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.new{color:#7dffb5}
.badge.game{color:#ffc58a}
.badge.done{color:#8af2e6}
.badge.lv{font:600 11.5px/1 var(--f-mono);letter-spacing:.03em}
.badge.star{width:28px;height:28px;padding:0;justify-content:center;color:#ffd84d}
.badge.star .ic{fill:currentColor;stroke:currentColor;width:15px;height:15px}

/* Hover actions (glass dock on the cover) */
.acts{position:absolute;z-index:5;left:50%;bottom:12px;display:flex;gap:2px;padding:4px;border-radius:16px;transform:translate(-50%,14px) scale(.92);opacity:0;pointer-events:none;transition:opacity .35s var(--out),transform .5s var(--spring);background:rgba(18,20,30,.42);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 10px 30px rgba(0,0,0,.3)}
.card:hover .acts,.card:focus-within .acts{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.card:hover .b-bl,.card:hover .b-br,.card:focus-within .b-bl,.card:focus-within .b-br{opacity:0;transition:opacity .25s}
.acts button{width:38px;height:36px;border:0;border-radius:12px;background:transparent;color:#fff;display:grid;place-items:center;transition:background .2s,transform .35s var(--spring)}
.acts button:hover{background:rgba(255,255,255,.18)}
.acts button:active{transform:scale(.86)}
.acts button.on{color:#ffd84d}
.acts button.on .ic{fill:currentColor}

/* Card text (YouTube-style row) */
.info{display:flex;gap:12px;align-items:flex-start;padding-inline:2px}
.info .av{width:36px;height:36px;font-size:15px;margin-top:1px}
.info .av.none .ic{width:17px;height:17px}
.txt{flex:1;min-width:0}
.t{margin:0;font:650 16px/1.3 var(--f-body);font-weight:600;letter-spacing:-.005em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty}
.s{margin-top:4px;font-size:13.5px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s .muted{color:var(--fg-3)}
.s .untag{color:var(--warn)}
.m{margin-top:3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12.5px;color:var(--fg-3)}
.m .sep{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6}
.m .done{color:var(--done)}
.m .note{display:inline-flex;align-items:center;gap:4px}
.more{flex:none;width:34px;height:34px;margin:-2px -6px 0 0;border:0;border-radius:50%;background:transparent;color:var(--fg-2);display:grid;place-items:center;transition:background .2s,transform .35s var(--spring)}
.more:hover{background:var(--hover);color:var(--fg)}
.more:active{transform:scale(.88)}

/* List view */
.grid.list{grid-template-columns:1fr;gap:10px}
.grid.list .card{flex-direction:row;align-items:center;gap:18px;padding:8px;border-radius:20px;transition:background .3s}
.grid.list .card:hover{background:var(--hover)}
.grid.list .cover{width:200px;flex:none}
.grid.list .frame{border-radius:12px}
.grid.list .card:hover .frame{transform:none}
.grid.list .acts{display:none}
.grid.list .b-tl .badge,.grid.list .b-bl .badge,.grid.list .b-br .badge{height:20px;font-size:10.5px;padding:0 7px}
.grid.list .info{flex:1;align-items:center}
.grid.list .t{-webkit-line-clamp:1;font-size:15.5px}
.grid.list .card:hover .b-bl,.grid.list .card:hover .b-br{opacity:1}
.grid.list .cover::before{display:none}
.grid.list .lx{display:flex}
.lx{display:none;gap:4px;flex:none}
.lx button{width:38px;height:38px;border-radius:12px;border:0;background:transparent;color:var(--fg-2);display:grid;place-items:center;transition:background .2s,color .2s}
.lx button:hover{background:var(--hover);color:var(--fg)}
.lx button.on{color:var(--gold)}
.lx button.on .ic{fill:currentColor}

/* Empty / error states */
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:70px 20px;border-radius:28px;color:var(--fg-2)}
.empty .big{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--hover);color:var(--fg-2);margin-bottom:6px}
.empty .big .ic{width:30px;height:30px}
.empty h3{margin:0;font:700 20px/1.2 var(--f-display);color:var(--fg);letter-spacing:-.02em}
.empty p{margin:0;max-width:44ch}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 17px;border-radius:14px;border:1px solid var(--line-2);background:var(--field);font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap;transition:background .2s,transform .35s var(--spring),border-color .2s}
.btn:hover{background:var(--hover);border-color:var(--line-2)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.small{height:34px;padding:0 12px;border-radius:11px;font-size:13px}
.btn.danger{color:#e5484d}

/* Side sheet */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .4s var(--out)}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(500px,calc(100vw - 24px));border-radius:30px;background:var(--glass-2);-webkit-backdrop-filter:blur(40px) saturate(190%);backdrop-filter:blur(40px) saturate(190%);transform:translateX(calc(100% + 40px)) scale(.98);transition:transform .65s var(--spring-soft),visibility 0s .65s;visibility:hidden;display:flex;flex-direction:column;overflow:hidden}
.sheet.open{transform:none;visibility:visible;transition:transform .65s var(--spring-soft),visibility 0s}
.sh-head{display:flex;align-items:center;gap:6px;padding:12px 12px 6px 20px;flex:none}
.sh-head .ttl{flex:1;font:600 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
.sh-body{flex:1;overflow:auto;overscroll-behavior:contain;padding:6px 20px 26px;display:flex;flex-direction:column;gap:22px}
.sh-body > *{flex-shrink:0}
.sh-cover{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:16/9;max-width:100%;background:var(--ph);container-type:inline-size;box-shadow:var(--shadow-sm)}
.sh-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sh-cover .chg{position:absolute;right:10px;bottom:10px;z-index:3}
.sh-title h2{margin:0;font:700 24px/1.15 var(--f-display);letter-spacing:-.025em;text-wrap:balance}
.sh-title p{margin:6px 0 0;color:var(--fg-2);font-size:14.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--hover);font-size:13px;font-weight:500;color:var(--fg-2)}
.tag .av{width:20px;height:20px;font-size:10px}
.tag.lv{font-family:var(--f-mono);font-size:12px}
.tag.game{color:var(--game)}
.tag.warn{color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.linkbox{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:14px;background:var(--hover);min-width:0}
.linkbox code{flex:1;min-width:0;font:500 12.5px/1.3 var(--f-mono);color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:all}
.blk{display:flex;flex-direction:column;gap:10px}
.blk > h4{margin:0;display:flex;align-items:center;gap:8px;font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
.blk > h4 .grow{flex:1}
.panel{padding:14px;border-radius:18px;background:var(--hover);display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flab{font-size:12.5px;font-weight:600;color:var(--fg-2)}
.inp{height:40px;border-radius:12px;border:1px solid var(--line-2);background:var(--field);padding:0 12px;outline:none;min-width:0;width:100%;transition:border-color .2s,box-shadow .2s}
.inp:focus,textarea.inp:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
textarea.inp{height:auto;min-height:96px;padding:10px 12px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini-seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--field);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.mini-seg button{height:32px;padding:0 12px;border-radius:9px;border:0;background:transparent;font-size:13px;font-weight:600;color:var(--fg-2);transition:background .2s,color .2s}
.mini-seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg)}
.lvls{display:flex;gap:6px;flex-wrap:wrap}
.lvls button{height:32px;min-width:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--field);font:600 12.5px/1 var(--f-mono);color:var(--fg-2);transition:all .2s}
.lvls button[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:var(--accent-fg)}
.out{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;border:1px dashed var(--line-2);font:500 13px/1.35 var(--f-mono);color:var(--fg);min-height:42px;word-break:break-word}
.out.empty-out{color:var(--fg-3)}
.hint{font-size:12.5px;color:var(--fg-3);line-height:1.45}
.hint b{color:var(--fg-2);font-weight:600}
.saved{font:500 11.5px/1 var(--f-mono);color:var(--new);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
.log{display:flex;flex-direction:column;gap:6px}
.log-i{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:12px;background:var(--field);font-size:13.5px}
.log-i .ic{color:var(--done)}
.log-i span{flex:1;min-width:0}
.log-i small{color:var(--fg-3);font-family:var(--f-mono);font-size:11.5px}
.log-i button{width:28px;height:28px;border-radius:8px;border:0;background:transparent;color:var(--fg-3);display:grid;place-items:center}
.log-i button:hover{background:var(--hover);color:var(--fg)}
.add-done{display:grid;grid-template-columns:minmax(140px,150px) 1fr auto;gap:8px;align-items:start}
.whobox{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:40px;padding:5px 6px;border-radius:12px;border:1px solid var(--line-2);background:var(--field);cursor:text;transition:border-color .2s,box-shadow .2s}
.whobox:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.whobox input{flex:1;min-width:70px;height:28px;border:0;background:transparent;outline:none;padding:0 6px}
.wchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 4px;border-radius:999px;background:var(--hover);font-size:13px;font-weight:600;animation:tin .4s var(--spring) both}
.wchip .av{width:20px;height:20px;font-size:10px}
.wchip button{width:20px;height:20px;border:0;border-radius:50%;background:transparent;color:var(--fg-3);display:grid;place-items:center;padding:0}
.wchip button:hover{background:var(--line-2);color:var(--fg)}
.wsug{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.wsug button{height:28px;padding:0 10px 0 4px;display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px dashed var(--line-2);background:transparent;font-size:12.5px;color:var(--fg-2)}
.wsug button .av{width:20px;height:20px;font-size:10px}
.wsug button:hover{border-style:solid;color:var(--fg)}
.log-names{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0;align-items:center}
.log-names .d{font-weight:600;margin-right:4px}
.pn{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 2px 0 8px;border-radius:999px;background:var(--hover);font-size:12.5px}
.pn button{width:20px!important;height:20px!important;border-radius:50%!important}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13.5px}
.kv dt{color:var(--fg-3)}
.kv dd{margin:0;color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pk{position:relative;display:flex;flex-direction:column;gap:5px;padding:0;border:0;background:none;text-align:left}
.pk .frame{border-radius:10px;box-shadow:none;outline:2px solid transparent;outline-offset:2px;transition:outline-color .2s}
.pk[aria-pressed="true"] .frame{outline-color:var(--accent)}
.pk span{font-size:11.5px;color:var(--fg-2);font-weight:500}
.pk .frame .auto{position:absolute;inset:0;display:grid;place-items:center;font:700 13px/1 var(--f-display);color:var(--fg-2);background:repeating-linear-gradient(135deg,var(--hover) 0 8px,transparent 8px 16px)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:14px}
.sw{position:relative;width:50px;height:30px;flex:none;border-radius:999px;border:0;background:var(--line-2);transition:background .3s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .45s var(--spring)}
.sw[aria-checked="true"]{background:var(--new)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.hid-i{display:flex;align-items:center;gap:10px;font-size:13.5px}
.hid-i span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.help p{margin:0 0 8px;font-size:13.5px;color:var(--fg-2)}
.help code{font:500 12.5px/1 var(--f-mono);padding:3px 6px;border-radius:6px;background:var(--field);color:var(--fg)}
.foot-note{font:500 11.5px/1.5 var(--f-mono);color:var(--fg-3)}

/* Preview */
.pv{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--scrim);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .4s var(--out)}
.pv.open{opacity:1;pointer-events:auto}
.pv-win{width:min(1320px,100%);height:min(88vh,900px);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;transform:translateY(30px) scale(.94);transition:transform .6s var(--spring-soft),width .6s var(--spring-soft)}
.pv.open .pv-win{transform:none}
.pv.phone .pv-win{width:min(420px,100%)}
.pv-bar{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 18px;flex:none}
.pv-bar b{flex:1;min-width:0;font:600 14.5px/1.2 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-stage{position:relative;flex:1;background:#fff;margin:0 8px 8px;border-radius:18px;overflow:hidden}
.pv-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.pv-load{position:absolute;inset:0;display:grid;place-items:center;color:#7d8497;font-size:14px;background:#f4f5f8}

/* Toasts */
.toasts{position:fixed;z-index:90;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:10px;padding:12px 18px 12px 14px;border-radius:999px;font-size:14px;font-weight:500;animation:tin .55s var(--spring) both;max-width:100%}
.toast .ic{color:var(--new)}
.toast.warn .ic{color:var(--warn)}
.toast.out{animation:tout .35s var(--out) both}
@keyframes tin{from{opacity:0;transform:translateY(18px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateY(10px) scale(.95)}}

/* Star burst */
.burst{position:fixed;z-index:95;pointer-events:none;width:0;height:0}
.burst i{position:absolute;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--gold);animation:fly .7s var(--out) forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

.foot{margin-top:70px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:500 12px/1.5 var(--f-mono);color:var(--fg-3)}

html.theming body,html.theming .glass,html.theming .chip,html.theming .btn,html.theming .t,html.theming .s,html.theming h1,html.theming h2{transition:background-color .45s var(--out),color .45s var(--out),border-color .45s var(--out)!important}
/* View transitions */
::view-transition-group(*){animation-duration:.5s;animation-timing-function:cubic-bezier(.2,.9,.25,1)}
::view-transition-old(root),::view-transition-new(root),::view-transition-old(topbar),::view-transition-new(topbar){animation:none}
::view-transition-group(topbar){animation:none;z-index:10}
::view-transition-new(*):only-child{animation:vt-in .45s var(--out) both}
::view-transition-old(*):only-child{animation:vt-out .3s var(--out) both}
@keyframes vt-in{from{opacity:0;transform:scale(.92)}}
@keyframes vt-out{to{opacity:0;transform:scale(.92)}}

@media (max-width:860px){
  .brand-t{display:none}
  .kbd{display:none}
  .hero{padding-top:30px}
}
@media (max-width:640px){
  .topbar{height:58px;gap:6px;padding:0 6px 0 8px;border-radius:20px}
  .mark{width:32px;height:32px}
  .search input{height:42px;padding-right:12px;font-size:16px}
  .hide-sm{display:none}
  .ibtn{width:38px;height:38px}
  .flabel{width:auto}

(() => {
'use strict';

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (n, cls = '') => `<svg class="ic ${cls}"><use href="#i-${n}"/></svg>`;
const norm = s => String(s || '').toLowerCase().replace(/ё/g, 'е').trim();
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const hueOf = s => hash(norm(s)) % 360;
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b > 1 && b < 5 ? f[1] : b === 1 ? f[0] : f[2]; };
const fmtN = (n, f) => `${n} ${plural(n, f)}`;
const DAY = 864e5;
const fmtDate = (t, year) => new Intl.DateTimeFormat('ru-RU', year ? {day:'numeric', month:'short', year:'numeric'} : {day:'numeric', month:'short'}).format(t).replace('.', '').replace(/\s?г\.?$/, '');
function ago(t) {
  if (!t) return '';
  const now = Date.now(), d0 = new Date(now); d0.setHours(0,0,0,0);
  const diff = now - t;
  if (diff < 6e4) return 'только что';
  if (diff < 36e5) { const m = Math.round(diff / 6e4); return `${fmtN(m, ['минуту','минуты','минут'])} назад`; }
  if (t >= d0.getTime()) return 'сегодня';
  if (t >= d0.getTime() - DAY) return 'вчера';
  const days = Math.floor((d0.getTime() - t) / DAY) + 1;
  if (days < 7) return `${fmtN(days, ['день','дня','дней'])} назад`;
  if (days < 31) { const w = Math.round(days / 7); return `${fmtN(w, ['неделю','недели','недель'])} назад`; }
  if (days < 365) { const m = Math.round(days / 30.4); return `${fmtN(m, ['месяц','месяца','месяцев'])} назад`; }
  return fmtDate(t, true);
}
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const reduced = matchMedia('(prefers-reduced-motion: reduce)');

/* ---------- storage ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('lc:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('lc:' + k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const idb = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    try { const r = indexedDB.open('lesson-catalog', 1); r.onupgradeneeded = () => r.result.createObjectStore('meta'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch (e) { rej(e); }
  }));
  const run = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction('meta', mode); const r = fn(t.objectStore('meta'));
    t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }));
  return {
    all: () => run('readonly', s => s.getAll()).catch(() => []),
    set: (k, v) => run('readwrite', s => s.put(v, k)).catch(() => null),
    clear: () => run('readwrite', s => s.clear()).catch(() => null)
  };
})();

/* ---------- config & state ---------- */
const DEFAULT_USER = 'pupsikinamerica-web';
const onPages = /\.github\.io$/i.test(location.hostname);
const hostUser = onPages ? location.hostname.split('.')[0] : null;
const selfRepo = onPages ? decodeURIComponent(location.pathname.split('/')[1] || '') : '';

const P = Object.assign({ tab: 'all', sort: 'new', view: 'grid', theme: 'system', favTop: true, motion: true, student: null, level: null, user: null }, store.get('prefs', {}));
const savePrefs = () => store.set('prefs', P);
const U0 = store.get('data', {});
const U = { fav: {}, notes: {}, done: {}, opens: {}, hidden: {}, cover: {}, desc: {}, ...U0 };
const saveData = debounce(() => store.set('data', U), 250);

const S = {
  user: P.user || hostUser || DEFAULT_USER,
  repos: [], lessons: [], by: new Map(), meta: new Map(),
  q: '', loading: true, error: null, rate: null, fetchedAt: 0, fromCache: false, firstRender: true
};
let lessonIdSeq = 0; const ids = new Map();
const idFor = n => ids.get(n) || (ids.set(n, ++lessonIdSeq), lessonIdSeq);

/* ---------- description parsing ---------- */
const LV = ['A0','A1','A2','B1','B2','C1','C2'];
function parseLevel(t) {
  const m = t.replace(/\s+/g, '').match(/^(?:pre-?)?([abc][0-2])(\+?)(?:[-–—\/]+([abc][0-2])(\+?))?$/i);
  if (!m) return null;
  const a = m[1].toUpperCase(), b = m[3] ? m[3].toUpperCase() : null;
  let levels = [a];
  if (b) { const i = LV.indexOf(a), j = LV.indexOf(b); if (i > -1 && j > -1) levels = LV.slice(Math.min(i, j), Math.max(i, j) + 1); }
  return { levels, label: b && b !== a ? `${a}${m[2]}–${b}${m[4]}` : b ? `${a}${m[2]}/${b}${m[4]}` : `${a}${m[2]}` };
}
function parseDesc(desc) {
  const o = { type: 'lesson', student: null, topics: [], levels: [], levelLabel: '', phase: null, lang: null, general: false };
  if (!desc) return o;
  const free = [];
  for (const raw of desc.split(/[,;\n]+/)) {
    const t = raw.trim(); if (!t) continue;
    const low = norm(t);
    if (/^(game|games|игра|игры)$/.test(low)) { o.type = 'game'; continue; }
    if (/^(warm[\s-]?up|разминка|начало урока|начало)$/.test(low)) { o.phase = 'Warm-up'; continue; }
    if (/^(wrap[\s-]?up|cool[\s-]?down|финал|конец урока|конец)$/.test(low)) { o.phase = 'Wrap-up'; continue; }
    const lv = parseLevel(t);
    if (lv) { o.levels.push(...lv.levels); o.levelLabel = o.levelLabel ? `${o.levelLabel}, ${lv.label}` : lv.label; continue; }
    if (/^(english|английский)$/.test(low)) { o.lang = 'English'; continue; }
    if (/^(italian|italiano|итальянский)$/.test(low)) { o.lang = 'Italiano'; continue; }
    if (/^(french|français|francais|французский)$/.test(low)) { o.lang = 'Français'; continue; }
    free.push(t);
  }
  if (o.type === 'game') o.topics = free;
  else if (free.length) {
    if (/^(общий|общее|общая|для всех|все|general|universal|any|—|-)$/.test(norm(free[0]))) { o.general = true; o.topics = free.slice(1); }

    case 'recover': idb.clear().then(() => { S.meta.clear(); shotFail.clear(); S.lessons.forEach(l => { l.meta = null; const el = cards.get(l.name); el && paintCover(el.querySelector('.frame'), l); }); Q.done = 0; Q.total = 0; S.lessons.forEach(l => enqueue(l)); toast('Обложки обновляются'); }); break;
  }
});
document.addEventListener('auxclick', e => { const o = e.target.closest('[data-open]'); if (o && e.button === 1) recordOpen(o.dataset.open); });
$('#import-file').addEventListener('change', e => { const f = e.target.files[0]; if (f) importData(f); e.target.value = ''; });
$('#scrim').addEventListener('click', closeSheet);
$('#pv').addEventListener('click', e => { if (e.target.id === 'pv') closePreview(); });
$('#pv-close').addEventListener('click', closePreview);
$('#pv-copy').addEventListener('click', () => copyText($('#pv-copy').dataset.url));
$('#pv-desk').addEventListener('click', () => { $('#pv').classList.remove('phone'); $('#pv-desk').setAttribute('aria-pressed', true); $('#pv-phone').setAttribute('aria-pressed', false); });
$('#pv-phone').addEventListener('click', () => { $('#pv').classList.add('phone'); $('#pv-phone').setAttribute('aria-pressed', true); $('#pv-desk').setAttribute('aria-pressed', false); });
$('#btn-settings').addEventListener('click', () => openSheet('settings'));
$('#btn-refresh').addEventListener('click', () => refresh(true));
$('#brand').addEventListener('click', e => { e.preventDefault(); scrollTo({ top: 0, behavior: 'smooth' }); });
const SORTS = [['new','Сначала новые'],['old','Сначала старые'],['az','По алфавиту, A–Z'],['za','По алфавиту, Z–A'],['upd','Недавно изменённые'],['-'],['opened','Недавно открытые'],['popular','Чаще всего открываю'],['student','По ученикам']];
const sortBtn = $('#sort-btn'), sortMenu = $('#sort-menu');
function renderSort() {
  $('#sort-label').textContent = (SORTS.find(s => s[0] === P.sort) || SORTS[0])[1];
  sortMenu.innerHTML = SORTS.map(([k, t]) => k === '-' ? '<div class="sep"></div>' : `<button role="option" data-sort="${k}" aria-selected="${P.sort === k}">${icon('check', 's')}${esc(t)}</button>`).join('');
}
function toggleSort(open) {
  open = open ?? !sortMenu.classList.contains('open');
  sortMenu.classList.toggle('open', open); sortBtn.setAttribute('aria-expanded', open);
  if (open) { const cur = sortMenu.querySelector('[aria-selected="true"]'); setTimeout(() => cur && cur.focus(), 30); }
}
sortBtn.addEventListener('click', e => { e.stopPropagation(); toggleSort(); });
sortMenu.addEventListener('click', e => {
  const b = e.target.closest('[data-sort]'); if (!b) return;
  e.stopPropagation(); P.sort = b.dataset.sort; savePrefs(); renderSort(); toggleSort(false); sortBtn.focus(); render(true);
});
sortMenu.addEventListener('keydown', e => {
  const items = $$('[data-sort]', sortMenu), i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus(); }
  if (e.key === 'Escape') { e.stopPropagation(); toggleSort(false); sortBtn.focus(); }
});
document.addEventListener('pointerdown', e => { if (sortMenu.classList.contains('open') && !e.target.closest('.sortdd')) toggleSort(false); });
renderSort();
const setView = v => { P.view = v; savePrefs(); $('#v-grid').setAttribute('aria-pressed', v === 'grid'); $('#v-list').setAttribute('aria-pressed', v === 'list'); render(true); };
$('#v-grid').addEventListener('click', () => setView('grid'));
$('#v-list').addEventListener('click', () => setView('list'));
const q = $('#q');
const onSearch = debounce(() => { S.q = q.value.trim(); render(true); }, 120);
q.addEventListener('input', () => { $('#q-clear').hidden = !q.value; $('#kbd').hidden = !!q.value; onSearch(); });
$('#q-clear').addEventListener('click', () => { q.value = ''; $('#q-clear').hidden = true; $('#kbd').hidden = false; S.q = ''; render(true); q.focus(); });
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if ((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) { e.preventDefault(); q.focus(); q.select(); return; }
  if (e.key === 'Escape') {
    if ($('#pv').classList.contains('open')) return closePreview();
    if (sheetMode) return closeSheet();
    if (document.activeElement === q && q.value) { $('#q-clear').click(); }
    else if (document.activeElement === q) q.blur();
    return;
  }
  if (sheetMode === 'lesson' && !typing && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { const b = $(`[data-act="${e.key === 'ArrowRight' ? 'sh-next' : 'sh-prev'}"]`); b && !b.disabled && b.click(); }
});
addEventListener('scroll', () => $('#topbar').classList.toggle('scrolled', scrollY > 24), { passive: true });
addEventListener('resize', debounce(() => moveInd(false), 120));

/* specular highlight follows the pointer on glass */
document.addEventListener('pointermove', e => {
  aurora.pointer(e.clientX / innerWidth, e.clientY / innerHeight);
  const g = e.target.closest && e.target.closest('.spec'); if (!g) return;
  const r = g.getBoundingClientRect(); g.style.setProperty('--mx', (e.clientX - r.left) + 'px'); g.style.setProperty('--my', (e.clientY - r.top) + 'px');
}, { passive: true });
document.addEventListener('pointerover', e => {
  const c = e.target.closest && e.target.closest('.card');
  if (!c) return; const l = S.by.get(c.dataset.name); aurora.focus(l && ((l.meta && l.meta.color) || `hsl(${hueOf(l.name)} 80% 58%)`));
}, { passive: true });
document.addEventListener('pointerout', e => { if (e.target.closest && e.target.closest('.card') && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.card'))) aurora.focus(null); }, { passive: true });

/* ---------- theme ---------- */
function setTheme(t) {
  P.theme = t; savePrefs();
  if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t;
  const d = effDark();
  $('#btn-theme').innerHTML = icon(d ? 'sun' : 'moon');
  $('#btn-theme').setAttribute('aria-label', d ? 'Включить светлую тему' : 'Включить тёмную тему');
  aurora.retheme();
}
const effDark = () => P.theme === 'dark' || (P.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
$('#btn-theme').addEventListener('click', () => {
  const next = effDark() ? 'light' : 'dark';
  const root = document.documentElement;
  root.classList.add('theming'); setTheme(next);
  clearTimeout(root._tt); root._tt = setTimeout(() => root.classList.remove('theming'), 600);
});

/* ---------- living background ---------- */
const palette = {
  list: [],
  add(c) { if (!c || this.list.includes(c) || this.list.length >= 7) return; this.list.push(c); aurora.setPalette(this.list); updateH1(); }
};
function updateH1() {}
const aurora = (() => {
  const cv = $('#aurora'), x = cv.getContext('2d');
  const parse = c => { const d = document.createElement('canvas').getContext('2d'); d.fillStyle = c; const v = d.fillStyle; if (v[0] === '#') return [parseInt(v.slice(1, 3), 16), parseInt(v.slice(3, 5), 16), parseInt(v.slice(5, 7), 16)]; const m = v.match(/\d+(\.\d+)?/g); return m ? m.slice(0, 3).map(Number) : [128, 128, 128]; };
  let pal = ['#ff6b5b', '#ffb347', '#3fa7ff', '#2fd39b', '#a77bff'].map(parse);
  let target = pal.map(c => c.slice()), cur = pal.map(c => c.slice());
  let focus = null, focusCur = null, fx = .5, fy = .25, px = .5, py = .25, raf = 0, last = 0, dark = false;
  const blobs = [
    { cx: .18, cy: .12, ax: .14, ay: .1, sx: .00011, sy: .00014, r: .55, p: 0 },
    { cx: .82, cy: .2, ax: .12, ay: .14, sx: .00009, sy: .00012, r: .5, p: 2 },
    { cx: .55, cy: .7, ax: .2, ay: .12, sx: .00007, sy: .0001, r: .62, p: 4 },
    { cx: .1, cy: .85, ax: .1, ay: .1, sx: .00012, sy: .00008, r: .45, p: 1 },
    { cx: .9, cy: .88, ax: .1, ay: .12, sx: .0001, sy: .00011, r: .48, p: 3 }
  ];
  function size() { const s = .22; cv.width = Math.max(64, Math.round(innerWidth * s)); cv.height = Math.max(64, Math.round(innerHeight * s)); }
  function isDark() { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
  function draw(t) {
    const w = cv.width, h = cv.height, m = Math.max(w, h);
    x.clearRect(0, 0, w, h);
    x.globalCompositeOperation = dark ? 'lighter' : 'source-over';
    for (let i = 0; i < cur.length; i++) for (let k = 0; k < 3; k++) cur[i][k] += (target[i][k] - cur[i][k]) * .03;
    if (focus) { focusCur = focusCur || focus.slice(); for (let k = 0; k < 3; k++) focusCur[k] += (focus[k] - focusCur[k]) * .06; }
    fx += (px - fx) * .02; fy += (py - fy) * .02;
    blobs.forEach((b, i) => {
      let bx = b.cx + Math.sin(t * b.sx + b.p) * b.ax, by = b.cy + Math.cos(t * b.sy + b.p * 1.3) * b.ay;
      let c = cur[i % cur.length];
      if (i === 0 && focusCur) { bx = bx * .45 + fx * .55; by = by * .45 + fy * .55; c = c.map((v, k) => v * .25 + focusCur[k] * .75); }
      const r = m * b.r, X = bx * w, Y = by * h;
      const g = x.createRadialGradient(X, Y, 0, X, Y, r);
      const col = dark ? c : c.map(v => v * .7 + 255 * .3);
      const a = dark ? .55 : .62;
      g.addColorStop(0, `rgba(${col[0] | 0},${col[1] | 0},${col[2] | 0},${a})`);
      g.addColorStop(.55, `rgba(${col[0] | 0},${col[1] | 0},${col[2] | 0},${a * .35})`);
      g.addColorStop(1, `rgba(${col[0] | 0},${col[1] | 0},${col[2] | 0},0)`);
      x.fillStyle = g; x.fillRect(0, 0, w, h);
    });
  }
  function loop(t) { raf = requestAnimationFrame(loop); if (t - last < 40) return; last = t; draw(t); }
  function setRunning() {
    cancelAnimationFrame(raf); raf = 0;
    const on = P.motion && !reduced.matches && !document.hidden;
    cv.style.display = P.motion || reduced.matches ? '' : 'none';
    if (on) raf = requestAnimationFrame(loop); else draw(performance.now());
  }
  size(); dark = isDark();
  addEventListener('resize', debounce(() => { size(); draw(performance.now()); }, 150));
  document.addEventListener('visibilitychange', setRunning);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { dark = isDark(); });
  return {
    setRunning,
    retheme() { dark = isDark(); if (!raf) draw(performance.now()); },
    setPalette(list) { const p = list.map(parse); target = blobs.map((_, i) => (p[i % p.length] || target[i]).slice()); if (!raf) { cur = target.map(c => c.slice()); draw(performance.now()); } },
    focus(c) { focus = c ? parse(c) : null; if (!c) focusCur = null; },
    pointer(a, b) { px = a; py = b; }
  };
})();
(function grain() { try { const c = document.createElement('canvas'); c.width = c.height = 160; const x = c.getContext('2d'); const d = x.createImageData(160, 160); for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 26; } x.putImageData(d, 0, 0); $('#grain').style.backgroundImage = `url(${c.toDataURL()})`; } catch (e) {} })();
if (navigator.userAgentData && navigator.userAgentData.brands && navigator.userAgentData.brands.some(b => /Chromium|Chrome/i.test(b.brand))) document.documentElement.classList.add('refract');

/* ---------- boot ---------- */
async function refresh(manual) {
  await loadRepos(manual);
  rebuildLessons();
  render(!S.firstRender);
  renderStats(S.firstRenderStats !== false); S.firstRenderStats = false;
  // warm everything in the background, visible cards are pulled forward by the observer
  setTimeout(() => S.lessons.forEach(l => enqueue(l)), 1200);
  progress();
}
async function boot() {
  setTheme(P.theme);
  $('#v-grid').setAttribute('aria-pressed', P.view === 'grid'); $('#v-list').setAttribute('aria-pressed', P.view === 'list');
  $('#brand-sub').textContent = S.user === DEFAULT_USER ? 'Stas Vinnikov' : S.user;
  const mq = matchMedia('(max-width: 640px)');
  const ph = () => { q.placeholder = mq.matches ? 'Поиск по урокам' : 'Поиск: название, ученик, тема, уровень'; };
  ph(); mq.addEventListener('change', ph);
  (await idb.all() || []).forEach(r => { if (r && r.name) { S.meta.set(r.name, r); palette.add(r.color); } });
  const cache = store.get(cacheKey(), null);
  if (cache && cache.pages) { S.repos = Object.values(cache.pages).flat(); S.fetchedAt = cache.at || 0; S.fromCache = true; S.loading = false; rebuildLessons(); render(false); renderStats(true); S.firstRenderStats = false; }
  else render(false);
  aurora.setRunning();
  refresh(false);
  setInterval(progress, 60000);
}
boot();
})();
